name: Docker Image CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      #START -- here you choose to do (1).docker image or (2).test run
      - name: setup buildx
        uses: docker/setup-buildx-action@v3

      - name: build the Docker image
        run: docker build -t bookapp:latest .

      - name: saving artifact
        run: docker save bookapp:latest | gzip > bookapp.tar.gz
      #save & download is optional - for self testing.
      - name: upload arttifact
        uses: actions/upload-artifact@v4
        with:
          name: bookapp-image
          path: bookapp.tar.gz
#END -- here you choose to do (1).docker image or (2).test run

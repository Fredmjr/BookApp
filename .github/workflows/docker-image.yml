name: Pushing to DockerHub

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      #START -- here you choose to do (1).docker image or (2).test run
      - name: setup buildx
        uses: docker/setup-buildx-action@v3

      - name: login to dockerhub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        #saving and uplaoding has to be made, adding in the future

      #save & download is optional - for self testing.
      - name: buil and push
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.respository_owner }}/bookapp:lastest
#END -- here you choose to do (1).docker image or (2).test run

name: Pushing to DockerHub

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      #START -- here you choose to do (1).docker image or (2).test run
      - name: setup buildx
        uses: docker/setup-buildx-action@v3

      - name: login to dockerhub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        #saving and uplaoding has to be made, adding in the future

      #save & download is optional - for self testing.
      - name: buil and push
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ghcr.io/fredmjr/bookapp:latest
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: ssh & deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ssh_host }}
          username: ${{ secrets.ssh_username }}
          password: ${{ secrets.ssh_password }}
          script: cd BookApp && docker compose pull app && docker compose up -d --pull always
#END -- here you choose to do (1).docker image or (2).test run
